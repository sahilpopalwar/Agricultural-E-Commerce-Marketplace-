server.ssl.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=test-delivery-service
spring.kafka.listener.auto-startup=false
app.clerk.enabled=false
app.otp.msg91.endpoint=https://example.test/otp
app.otp.msg91.auth-key=test
app.otp.msg91.template-id=test
app.otp.hash-secret=test-secret
app.kafka.order-delivery-topic=test-delivery-events
