# Server Configuration
server.port=8443
server.servlet.session.timeout=30m

# SSL Configuration
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-password=changeit

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/freshmarket
spring.datasource.username=root
spring.datasource.password=6016
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# dialect is auto-detected for MySQL — no need to set it explicitly
spring.jpa.open-in-view=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Session Cookie (these ARE valid Spring Boot properties)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# H2 Console (disable — using MySQL)
spring.h2.console.enabled=false

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.org.project.oopjava=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Development Tools
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# MSG91 OTP delivery. Keep credentials in environment variables, never in source control.
app.otp.msg91.endpoint=https://control.msg91.com/api/v5/otp
app.otp.msg91.auth-key=${MSG91_AUTH_KEY:}
app.otp.msg91.template-id=${MSG91_TEMPLATE_ID:}
app.otp.msg91.country-code=91

# Optional Clerk bearer-token authentication for /api/**.
# Set CLERK_ENABLED=true and CLERK_JWKS_URL in the environment to enable it.
app.clerk.enabled=${CLERK_ENABLED:false}
app.clerk.jwks-url=${CLERK_JWKS_URL:}
app.clerk.publishable-key=${CLERK_PUBLISHABLE_KEY:}

# MySQL Connector (suppress relocated artifact warning)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# -------------------------------------------------------
# NOTE: The following properties were REMOVED because they
# are not recognised by Spring Boot and have no effect.
# Configure them in SecurityConfig.java instead:
#
#   security.headers.*            → http.headers(...) in SecurityConfig
#   spring.security.csrf.*        → http.csrf(...) in SecurityConfig
#   spring.security.remember-me.* → http.rememberMe(...) in SecurityConfig
#   spring.mvc.cors.*             → WebMvcConfigurer.addCorsMappings() in WebConfig
# -------------------------------------------------------