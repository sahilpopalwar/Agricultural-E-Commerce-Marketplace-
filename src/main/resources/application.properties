# Server Configuration
server.port=8443
app.public-base-url=${PUBLIC_BASE_URL:https://localhost:8443}
app.password-reset.delivery-enabled=${PASSWORD_RESET_DELIVERY_ENABLED:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
server.servlet.session.timeout=30m

# SSL Configuration
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-password=changeit

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/freshmarket
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=6016
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# dialect is auto-detected for MySQL — no need to set it explicitly
spring.jpa.open-in-view=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Session Cookie (these ARE valid Spring Boot properties)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# H2 Console (disable — using MySQL)
spring.h2.console.enabled=false

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.org.project.oopjava=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Development Tools
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# MSG91 OTP delivery.
# Create an OTP template in the MSG91 dashboard, then set both environment
# variables before starting Spring Boot. Never commit these credentials.
# PowerShell:
#   $env:MSG91_AUTH_KEY="your_msg91_auth_key"
#   $env:MSG91_TEMPLATE_ID="your_msg91_template_id"
app.otp.msg91.endpoint=https://control.msg91.com/api/v5/otp
app.otp.msg91.auth-key=${MSG91_AUTH_KEY:}
app.otp.msg91.template-id=${MSG91_TEMPLATE_ID:}
app.otp.msg91.country-code=91
app.password-reset.delivery-enabled=${PASSWORD_RESET_DELIVERY_ENABLED:false}

# Clerk setup:
# 1. Create/select an instance at https://dashboard.clerk.com.
# 2. Set CLERK_PUBLISHABLE_KEY to the instance's pk_test_... or pk_live_... key.
# 3. To validate Clerk bearer tokens on /api/**, also set CLERK_ENABLED=true and
#    CLERK_JWKS_URL to the instance's JWKS endpoint from the Clerk dashboard.
# Never commit these values to source control.
app.clerk.enabled=${CLERK_ENABLED:false}
app.clerk.jwks-url=${CLERK_JWKS_URL:}
app.clerk.publishable-key=${CLERK_PUBLISHABLE_KEY:}

# Kafka order delivery streaming. Set KAFKA_BOOTSTRAP_SERVERS and enable the
# listener in deployments; no credentials are stored in this file.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:order-delivery-service}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=org.project.oopjava.delivery.OrderDeliveryEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=org.project.oopjava.delivery
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}
app.kafka.order-delivery-topic=${KAFKA_ORDER_DELIVERY_TOPIC:order-delivery-events}

# MySQL Connector (suppress relocated artifact warning)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# -------------------------------------------------------
# NOTE: The following properties were REMOVED because they
# are not recognised by Spring Boot and have no effect.
# Configure them in SecurityConfig.java instead:
#
#   security.headers.*            → http.headers(...) in SecurityConfig
#   spring.security.csrf.*        → http.csrf(...) in SecurityConfig
#   spring.security.remember-me.* → http.rememberMe(...) in SecurityConfig
#   spring.mvc.cors.*             → WebMvcConfigurer.addCorsMappings() in WebConfig
# -------------------------------------------------------

# Secrets are supplied through the environment in deployment.
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-password=${SSL_KEY_PASSWORD:${SSL_KEYSTORE_PASSWORD:}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=false