    <div class="container">
        <div id="wishlist-page" class="page-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Your Wishlist</h3>
                    <button class="btn btn-primary" onclick="clearWishlist()">
                        <i class="fas fa-trash"></i> Clear All
                    </button>
                </div>
                
                <div class="wishlist-grid" id="wishlist-items">
                    <!-- Wishlist items will be added here -->
                    <div class="wishlist-empty" th:if="${#lists.isEmpty(wishlistItems)}">
                        <p>Your wishlist is empty</p>
                        <a th:href="@{/user}" class="btn btn-primary">Browse Products</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
