<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fresh Market</title>
    <link rel="stylesheet" href="/css/register.css">
</head>

<body>
    <header>
        <a href="/" class="logo">Fresh Market</a>
    </header>
    <main class="container">
        <div class="card">
            <div class="card-header">
                <h2>Sign in</h2>
            </div>
            <div class="card-body">
                <p th:if="${error}" th:text="${error}" class="text-muted" role="alert"></p>
                <p th:if="${error != null and #strings.contains(error, 'MSG91 OTP is not configured')}"
                    class="text-muted">
                    Configure MSG91_AUTH_KEY and MSG91_TEMPLATE_ID, then restart the application.
                </p>
                <p th:if="${param.logout}" class="text-muted">You have been signed out.</p>
                <form th:if="${otpSent == null}" th:action="@{/login/request-otp}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="form-group">
                        <label for="phone">Mobile number</label>
                        <input type="tel" id="phone" name="phone" class="form-control" required autofocus>
                    </div>
                    <button type="submit" class="btn">Send OTP</button>
                </form>
                <div class="form-footer">
                    <p>Or use Clerk authentication:</p>
                    <a class="btn" href="/clerk-login">Continue with Clerk</a>
                </div>
                <form th:if="${otpSent}" th:action="@{/login/verify-otp}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="phone" th:value="${phone}">
                    <div class="form-group">
                        <label for="otp">One-time password</label>
                        <input type="text" id="otp" name="otp" class="form-control" inputmode="numeric"
                            pattern="[0-9]{6}" maxlength="6" required autofocus>
                    </div>
                    <button type="submit" class="btn">Verify and continue</button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
