<!-- Wishlist Page -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOM8z4+2e5c6e5c6e5c6e5c6e5c6e5c6e5c6e5" crossorigin="anonymous" />
<link rel="stylesheet" href="/css/wishlist.css">
<div id="wishlist-page" class="page-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Your Wishlist</h3>
                    <div class="btn btn-primary" onclick="clearWishlist()">

                    </div>
                </div>
                
                <div class="wishlist-grid" id="wishlist-items">
                    <!-- Wishlist items will be added here -->

            </div>
</div>
