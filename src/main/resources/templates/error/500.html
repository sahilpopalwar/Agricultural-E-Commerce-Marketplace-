<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <h1 class="error-code" th:text="${errorCode}">500</h1>
            <h2 class="error-message" th:text="${errorMessage}">Internal Server Error</h2>
            <p>We're sorry, but something went wrong on our end. Our team has been notified and is working to fix the issue.</p>
            <div class="error-actions">
                <a th:href="@{/}" class="btn btn-primary">Go to Homepage</a>
                <a th:href="@{/contact}" class="btn btn-secondary">Contact Support</a>
            </div>
        </div>
    </div>
</body>
</html>
