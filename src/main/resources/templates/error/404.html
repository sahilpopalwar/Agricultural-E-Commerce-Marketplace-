<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <h1 class="error-code" th:text="${errorCode}">404</h1>
            <h2 class="error-message" th:text="${errorMessage}">Page Not Found</h2>
            <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <div class="error-actions">
                <a th:href="@{/}" class="btn btn-primary">Go to Homepage</a>
                <a th:href="@{/contact}" class="btn btn-secondary">Contact Support</a>
            </div>
        </div>
    </div>
</body>
</html>
