<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <h1 class="error-code" th:text="${errorCode}">403</h1>
            <h2 class="error-message" th:text="${errorMessage}">Access Denied</h2>
            <p>You don't have permission to access this page. Please contact the administrator if you believe this is an error.</p>
            <div class="error-actions">
                <a th:href="@{/}" class="btn btn-primary">Go to Homepage</a>
                <a th:href="@{/contact}" class="btn btn-secondary">Contact Support</a>
            </div>
        </div>
    </div>
</body>
</html>
